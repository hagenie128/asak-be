spring.application.name=ASAK-backend

# JPA 설정
# update : 변경된 컬럼 추가(기존 데이터가 유지), create : 매번 재생성
spring.jpa.hibernate.ddl-auto=none

# 실행 SQL 콘솔 출력(작업용 -> true, 운영할때는 false)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 1. 서버 포트 설정
server.port=8080

# 2. 외부 MySQL 데이터베이스 연결 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 3. 외부 MySQL 데이터베이스 연결 설정 (연결할 계정 + 사용할 driver 연결해야함 mysql사용할 거라는) -> 연결 거부 에러 발생 & 시간대(타임존)를 통일 & 접속 거부 에러 발생 & 글자깨짐 에러 발생시 사용할 수 있는 코드 --현재 주석 처리 --
#spring.datasource.url=jdbc:mysql://nam3324.synology.me:33338/asak_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.file.menu-upload-dir=uploads/menu

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB



# MyBatis 설정
# MyBatis 매퍼 파일 위치 설정
mybatis.mapper-locations: classpath:/mappers/**/*.xml

# 별칭 설정 (패키지 기준으로 삽입함)
mybatis.type-aliases-package=com.asak
mybatis.configuration.map-underscore-to-camel-case=true


# jwt.secret=day18-spring-security-jwt-secret-key-minimum-256bits-required!!
# jwt.access-expiration=1800000
# jwt.refresh-expiration=604800000


# .env 파일 로드
spring.config.import=optional:file:.env[.properties]

# 프론트엔드 주소 (추후 추가)
#app.frontend-url=http://localhost:3000

# Spring DevTools 설정
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s